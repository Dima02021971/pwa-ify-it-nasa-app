<!DOCTYPE html>
<html lang="en">
<head>
  
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b3d91">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    
    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesBtn">Get Space Images</button>
    </div>
    <div class="notification-controls">
  <button id="enable-notifications" type="button">
    🔔 Enable Notifications
  </button>
  <p id="notification-status" role="status"></p>
</div>
<div id="install-banner" class="install-banner" hidden>
  <div class="install-message">
    <strong>🚀 Install NASA Space Explorer</strong>
    <p>Explore the universe directly from your desktop!</p>
  </div>
  <button id="install-button" type="button">
    Install App
  </button>
</div>
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal for viewing a full-size image + full description -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
